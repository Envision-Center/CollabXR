name: "CollabXR Setup"
description: "Performs initial CollabXR setup for use in other pipelines"

inputs:
  unity:
    description: "Unity executable path"
    requireD: true
  build-profile:
    description: "Build profile to use"
    requireD: true
  keystore-password:
    description: "Password to use for unlocking the keystore"
    required: true
  output-name:
    description: "Name of resulting binary/directory"
    required: true


# https://docs.github.com/en/actions/tutorials/create-actions/create-a-composite-action#creating-an-action-metadata-file
outputs:
  filepath:
    description: "Filepath of build output."
    value: ${{ steps.build.outputs.OUTPUT_PATH }}

runs:
  using: composite

  steps:
      - name: Build CollabXR Executable
        id: build
        shell: bash
        run: |
          OUTPUT_PATH=${{ github.workspace }}/Build/${{ inputs.output-name }}
          echo "OUTPUT_PATH=$OUTPUT_PATH" >> $GITHUB_OUTPUT
          mkdir -p ${{ github.workspace }}/Build/
          COLLAB_KEYSTORE_PASSWORD=${{ inputs.keystore-password }} "${{ inputs.unity }}" -quit -batchmode -nographic -silent-crashes -logFile - -projectPath ${{ github.workspace }} -activeBuildProfile "${{ inputs.build-profile }}" -build "${OUTPUT_PATH}"

      - name: List Build Outputs
        id: list
        shell: bash
        run: |
          ls ${{ github.workspace }}/Build/

      - name: Strip Debug Info
        id: strip-debug
        continue-on-error: true
        shell: bash
        run: |
          rm -rf ${{ github.workspace }}/Build/CollabXR_BurstDebugInformation_DoNotShip
